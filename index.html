        <style>
            .space-structure {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                overflow: hidden;
            }
            .floating-rocket {
                position: absolute;
                filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
            }
            .floating-rocket-visual {
                animation: float 6s ease-in-out infinite;
            }
            @keyframes float {
                0%, 100% { transform: translateY(0) rotate(5deg); }
                50% { transform: translateY(-30px) rotate(-5deg); }
            }
            @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            .space-circle {
                position: absolute;
                opacity: 0.3;
            }
            .f1-car {
                position: absolute;
                z-index: 1;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            }
            .car-1 {
                top: 40%;
                left: -100px;
                animation: race-by 4s linear infinite;
            }
            .car-2 {
                top: 60%;
                right: -100px;
                animation: race-by-reverse 5s linear infinite 2s;
            }
            @keyframes race-by {
                0% { left: -150px; transform: scale(0.8) skewX(10deg); }
                50% { transform: scale(1.1) skewX(0deg); }
                100% { left: 110%; transform: scale(0.8) skewX(-10deg); }
            }
            @keyframes race-by-reverse {
                0% { right: -150px; transform: scale(0.8) skewX(-10deg) rotateY(180deg); }
                50% { transform: scale(1.1) skewX(0deg) rotateY(180deg); }
                100% { right: 110%; transform: scale(0.8) skewX(10deg) rotateY(180deg); }
            }
            .myth-planet {
                position: absolute;
                z-index: 1;
            }
            .myth-planet-visual {
                animation: myth-float 10s ease-in-out infinite;
            }
            .myth-ship {
                position: absolute;
                z-index: 1;
                filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4));
            }
            .myth-ship-visual {
                animation: myth-float 8s ease-in-out infinite reverse;
            }
            .orb {
                position: absolute;
                z-index: 0;
            }
            @keyframes myth-float {
                0%, 100% { transform: translate(0, 0) rotate(0deg); }
                33% { transform: translate(20px, -30px) rotate(5deg); }
                66% { transform: translate(-15px, 20px) rotate(-5deg); }
            }
            @keyframes pulse {
                0%, 100% { opacity: 0.3; transform: scale(1); }
                50% { opacity: 0.8; transform: scale(1.2); }
            }
        </style>
